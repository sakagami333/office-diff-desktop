name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      OFFICEDIFF_PS: powershell   # pwsh(7) ではなく Windows 標準の 5.1 で検証
      OFFICEDIFF_NOOPEN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 依存（サンプル生成とpytest用）
        run: python -m pip install -q -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q

      - name: .bat 経由で日本語ファイル名を比較（ドラッグ＆ドロップ相当）
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\check_bat_windows.ps1

      - name: 配布用 zip が作れること
        run: python scripts/make_zip.py OfficeDiff.zip

  linux-pwsh:
    name: PowerShell 7 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 依存
        run: python3 -m pip install -q -r requirements-dev.txt
      - name: pytest
        run: python3 -m pytest -q
